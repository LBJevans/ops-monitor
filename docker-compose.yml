services:
  ops-monitor:
    build: .
    container_name: ops-monitor

    ports:
      - "8501:8501"
      - "8000:8000"

    volumes:
      - .:/app

    command: >
      sh -c "
      uvicorn app.main:app --host 0.0.0.0 --port 8000 &
      streamlit run dashboard/dashboard.py --server.port=8501 --server.address=0.0.0.0
      "